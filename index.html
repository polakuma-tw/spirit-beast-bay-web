<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>靈獸海灣測試</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="immersive-bg">

        <div class="character-section">
            <img id="npc-img" src="img/charactar/ch01.png" class="character-img fix-white-edge" alt="角色立繪">
        </div>

        <div class="ui-section">
            <div class="dialog-bubble">
                <p id="dialog-text">我是波樂熊。<br>你手很癢給我亂切到這邊幹嘛？這邊還在測試</p>
            </div>
            <div class="player-options">
                <button onclick="changeReaction('img/charactar/ch03.png', '好的，這是目前的屋子架構實驗...')">● 查看屋子架構</button>
                <button onclick="changeReaction('img/charactar/ch04.png', '看到你喜歡，我也很高興！')">● 選項二：表示讚賞</button>
                <button onclick="changeReaction('img/charactar/ch02.png', '沒問題，下次見。')">● 關閉測試</button>
            </div>
        </div>

    </div>

    <script>
        function changeReaction(imagePath, newText) {
            // 加入時間戳，破解瀏覽器快取，保證圖片秒換
            const newSrc = imagePath.split('?')[0] + '?t=' + new Date().getTime();
            document.getElementById('npc-img').src = newSrc;
            document.getElementById('dialog-text').innerHTML = newText;
        }
    </script>
</body>

</html>
