<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈獸海灣 - 沉浸式對話實驗</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="immersive-bg">
        
        <div class="game-container">
            
            <div class="character-box">
                <img id="npc-img" src="img/charactar/ch01.png" alt="角色">
            </div>

            <div class="ui-group">
                <div class="dialog-bubble">
                    <p id="dialog-text">歡迎來到靈獸海灣！<br>我是波樂熊，今天想看點什麼？</p>
                </div>
                
                <div class="player-options">
                    <button onclick="changeReaction('img/charactar/ch01.png', '好的，這是目前的屋子架構實驗...')">● 查看屋子架構</button>
                    <button onclick="changeReaction('img/charactar/ch02.png', '看到你喜歡，我也很高興！')">● 選項二：表示讚賞</button>
                    <button onclick="changeReaction('img/charactar/ch04.png', '沒問題，下次見。')">● 關閉測試</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function changeReaction(imagePath, newText) {
            document.getElementById('npc-img').src = imagePath;
            document.getElementById('dialog-text').innerHTML = newText;
        }
    </script>
</body>
</html>
