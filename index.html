<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>靈獸海灣 - 沉浸式架構</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="immersive-bg">
        <div class="game-view">
            
            <div class="character-section">
                <img id="npc-img" src="img/charactar/ch01.png" alt="角色立繪">
            </div>

            <div class="ui-section">
                <div class="dialog-bubble">
                    <p id="dialog-text">歡迎回來，波樂熊。<br>今天的構圖還滿意嗎？</p>
                </div>
                
                <div class="player-options">
                    <button onclick="changeReaction('img/charactar/ch01.png', '這是我目前的個人網站實驗環境。')">● 查看目前的架構</button>
                    <button onclick="changeReaction('img/charactar/ch02.png', '太棒了！比例現在看起來很舒服。')">● 選項二：表示滿意</button>
                    <button onclick="changeReaction('img/charactar/ch03.png', '還在微調中...請再等我一下。')">● 選項三：繼續優化</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function changeReaction(imagePath, newText) {
            document.getElementById('npc-img').src = imagePath;
            document.getElementById('dialog-text').innerHTML = newText;
        }
    </script>
</body>
</html>
