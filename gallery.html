<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>驚喜包作品集 - PolaKuma</title>
    <!-- 引入獨立 CSS 樣式檔 -->
    <link rel="stylesheet" href="./css/gallery.css">
</head>
<body>

    <!-- R18 年齡警示全螢幕攔截彈窗 (Age Gate - 全白極簡風) -->
    <div id="age-gate-overlay" class="age-gate-overlay">
        <img class="age-gate-logo" src="polakumalogo.svg" alt="PolaKuma Logo">
        <div class="age-gate-text">
            <h2 class="age-gate-title">年齡限制警示 / Age Restriction</h2>
            <p class="age-gate-desc-zh">本網站內容可能包含成人題材，僅適合年滿 18 歲之成年人瀏覽。<br>請確認您是否已年滿 18 歲或已達當地法定成年年齡。</p>
            <p class="age-gate-desc-en">This website contains mature content intended for audiences aged 18 and older.<br>Please confirm that you are at least 18 years old or of legal adult age.</p>
        </div>
        <div class="age-gate-buttons">
            <button id="btn-age-confirm" class="btn-age-confirm">我已滿 18 歲，進入網站 / I am 18+, Enter</button>
            <button id="btn-age-cancel" class="btn-age-cancel">未滿 18 歲，離開 / Under 18, Leave</button>
        </div>
    </div>

    <div id="scene">
        <div id="focus-panel"></div>
        <img id="logo" src="polakumalogo.svg" alt="PolaKuma Logo">
    </div>

    <!-- 底部功能按鈕列 -->
    <div id="control-bar">
        <button class="ctrl-btn" id="btn-prev" title="上一頁 | Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="ctrl-btn" id="btn-rand-page" title="隨機抽樣 | Random Sample">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>
        </button>
        <button class="ctrl-btn" id="btn-bubble" title="隨機泡泡 | Random Bubble">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </button>
        <button class="ctrl-btn" id="btn-ring" title="環狀排列模式 | Ring Layout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"></path><path d="M4 4h4v4H4z"></path><path d="M16 4h4v4h-4z"></path></svg>
        </button>
        <button class="ctrl-btn" id="btn-list" title="作品列表 | Gallery List">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="下一頁 | Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <!-- 作品列表彈出面板 -->
    <div id="list-modal" class="list-modal">
        <div class="list-modal-backdrop" id="list-modal-backdrop"></div>
        <div class="list-modal-panel">
            <div class="list-modal-header">
                <div class="list-modal-title">
                    <span>📋 作品列表</span>
                    <span class="list-modal-count" id="list-modal-count">(0)</span>
                </div>
                <button class="list-modal-close" id="list-modal-close" title="關閉">✕</button>
            </div>
            <div class="list-modal-body" id="list-items-container">
                <!-- 動態生成清單項目 -->
            </div>
        </div>
    </div>

    <!-- 不規則液體遮罩 -->
    <div id="liquid-curtain">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,160 C320,300 420,40 680,180 C940,320 1080,20 1440,160 L1440,320 L0,320 Z"></path>
        </svg>
        <div class="liquid-body"></div>
    </div>

    <!-- 作品相片牆詳情 (Detail View) -->
    <div id="detail-view" class="detail-view">
        <!-- 右上角登入狀態 UI -->
        <div id="detail-auth-bar" class="detail-auth-bar">
            <div class="auth-guest" id="auth-guest">
                <button class="auth-btn" id="btn-auth-login">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>登入</span>
                </button>
            </div>
            <div class="auth-user" id="auth-user" style="display: none;">
                <img class="auth-avatar" id="auth-avatar-img" src="polakumalogo.svg" alt="User Avatar">
                <span class="auth-username" id="auth-username-label">使用者</span>
                <button class="auth-logout-btn" id="btn-auth-logout" title="登出">登出</button>
            </div>
        </div>

        <!-- 主體雙欄佈局 (Split Layout) -->
        <div class="detail-layout">
            <!-- 左側固定資訊區 (Fixed Sidebar) -->
            <aside class="detail-sidebar" id="detail-sidebar">
                <div class="sidebar-logo">
                    <img src="polakumalogo.svg" alt="PolaKuma Logo" class="sidebar-logo-img">
                </div>
                
                <div class="sidebar-cover-wrapper">
                    <img id="detail-cover-img" class="sidebar-cover-img" src="" alt="Cover">
                </div>

                <div class="sidebar-info-block">
                    <div class="sidebar-title-row">
                        <span class="sidebar-id" id="detail-id">--</span>
                        <span class="sidebar-name" id="detail-name">載入中...</span>
                    </div>
                    <div class="sidebar-stats-row" id="detail-stats-box">
                        <span class="stat-item"><span class="stat-icon">❤️</span> <span id="detail-likes-count">0</span></span>
                        <span class="stat-item"><span class="stat-icon">💬</span> <span id="detail-comments-count">0</span></span>
                    </div>
                </div>
            </aside>

            <!-- 右側無縫相片牆 (Scrollable Seamless Grid) -->
            <main class="detail-main" id="detail-main">
                <div class="seamless-gallery" id="gallery-container">
                    <!-- 動態渲染無縫圖片牆 -->
                </div>
            </main>
        </div>

        <!-- 底部中央泡泡控制列 (FAB) -->
        <div class="detail-fab-bar" id="detail-fab-bar">
            <button class="fab-btn" id="fab-comment" title="留言 | Comments">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <button class="fab-btn" id="fab-share" title="分享 | Share">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
            <button class="fab-btn" id="fab-like" title="點擊愛心 | Like">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <button class="fab-btn" id="fab-back" title="回作品集 | Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </div>

        <!-- 留言板彈出視窗 (Comment Modal / Drawer) -->
        <div id="comment-modal" class="comment-modal">
            <div class="comment-modal-backdrop" id="comment-modal-backdrop"></div>
            <div class="comment-modal-panel">
                <div class="comment-modal-header">
                    <div class="comment-modal-title" id="comment-modal-title">💬 留言板</div>
                    <button class="comment-modal-close" id="comment-modal-close" title="關閉">✕</button>
                </div>
                <div class="comment-list" id="comment-list">
                    <!-- 動態渲染留言列表 -->
                </div>
                
                <!-- 留言輸入區 (已登入狀態) -->
                <div class="comment-input-area" id="comment-auth-input" style="display: none;">
                    <div class="comment-user-badge">
                        <img class="comment-user-avatar" id="comment-user-avatar" src="polakumalogo.svg" alt="User">
                        <span class="comment-user-name" id="comment-user-name">訪客</span>
                    </div>
                    <div class="comment-input-row">
                        <input type="text" class="comment-input" id="comment-input-text" placeholder="留下你對這部作品的想法...">
                        <button class="comment-submit-btn" id="comment-submit-btn">發布</button>
                    </div>
                </div>

                <!-- 未登入提示區 -->
                <div class="comment-login-prompt" id="comment-guest-prompt">
                    <button class="btn-google-login" id="btn-comment-login">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
                        <span>使用 Google 帳號登入後留言</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 全螢幕圖片燈箱 (Lightbox) -->
        <div id="lightbox-modal" class="lightbox-modal">
            <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
            <div class="lightbox-content">
                <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged Photo">
                <button class="lightbox-close-btn" id="lightbox-close-btn" title="關閉燈箱">✕</button>
            </div>
        </div>
    </div>

    <!-- 引入獨立 JavaScript 邏輯檔 -->
    <script src="./js/gallery.js"></script>
</body>
</html>
